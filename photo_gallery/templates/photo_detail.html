
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ photo.title }} - Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
            color: #222;
        }

        .photo-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .photo-container img {
            display: block;
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="photo-container">
        <a class="back-link" href="{% url 'home' %}">
            &larr; Back to Gallery
        </a>

        <h1>{{ photo.title }}</h1>

        <img src="{{ photo.image.url }}" alt="{{ photo.title }}">

        <p>{{ photo.description|default:"No description provided." }}</p>

        <p>
            Uploaded by: {{ photo.uploader.username }}
        </p>

        <p>
            Uploaded on: {{ photo.created_at|date:"F j, Y" }}
        </p>

        <h3>Tags</h3>
        {% for tag in photo.tags.all %}
            <span>{{ tag.name }}</span>
        {% empty %}
            <p>No tags added.</p>
        {% endfor %}
    </div>

</body>
</html>
